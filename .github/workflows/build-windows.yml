name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Check release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package.json version v$version."
          }

      - name: Check main build version is not already released
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $existing = gh api "repos/${{ github.repository }}/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $sha = ($existing | ConvertFrom-Json).object.sha
            if ($sha -ne $env:GITHUB_SHA) {
              throw "Tag $tag already exists at $sha. Bump package.json version before pushing main."
            }
          }
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Build browser edition
        run: npm run build

      - name: Upload browser edition
        uses: actions/upload-artifact@v6
        with:
          name: moduleResume-browser-windows-x64
          path: |
            dist/moduleResume.exe
            dist/LICENSE
            dist/NOTICE
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows installer
        run: npm run build:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: moduleResume-installer-windows-x64
          path: |
            dist-installer/moduleResume-Setup-*.exe
            LICENSE
            NOTICE
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -notlike 'refs/tags/v*' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Host 'Skipping release for non-main branch.'
            exit 0
          }

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = "dist-installer/moduleResume-Setup-$version.exe"
          if (!(Test-Path -LiteralPath 'dist/moduleResume.exe') -or !(Test-Path -LiteralPath $installer) -or !(Test-Path -LiteralPath 'LICENSE') -or !(Test-Path -LiteralPath 'NOTICE')) {
            throw 'Both EXE files, LICENSE and NOTICE must exist before publishing.'
          }

          # Main builds automatically create the version tag when it does not exist.
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $existing = gh api "repos/${{ github.repository }}/git/ref/tags/$tag" 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha=$env:GITHUB_SHA | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed to create tag $tag." }
            } else {
              $sha = ($existing | ConvertFrom-Json).object.sha
              if ($sha -ne $env:GITHUB_SHA) {
                throw "Tag $tag already exists at $sha. Bump package.json version before pushing main."
              }
            }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'dist/moduleResume.exe' $installer 'LICENSE' 'NOTICE' --clobber
          } else {
            $options = @('--verify-tag', '--generate-notes')
            if ($version -match '-') { $options += '--prerelease' }
            gh release create $tag 'dist/moduleResume.exe' $installer 'LICENSE' 'NOTICE' @options
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
