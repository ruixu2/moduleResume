name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Check release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package.json version v$version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build browser edition
        run: npm run build

      - name: Upload browser edition
        uses: actions/upload-artifact@v6
        with:
          name: moduleResume-browser-windows-x64
          path: |
            dist/moduleResume.exe
            dist/LICENSE
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows installer
        run: npm run build:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: moduleResume-installer-windows-x64
          path: |
            dist-installer/moduleResume-Setup-*.exe
            LICENSE
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "dist-installer/moduleResume-Setup-$version.exe"
          if (!(Test-Path -LiteralPath 'dist/moduleResume.exe') -or !(Test-Path -LiteralPath $installer)) {
            throw 'Both EXE files must exist before publishing.'
          }
          $options = @('--verify-tag', '--generate-notes')
          if ($version -match '-') { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME 'dist/moduleResume.exe' $installer 'LICENSE' @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
